name: Build Next

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (manual runs upload artifacts only)
        type: choice
        default: all
        options: [all, win-x64, mac-arm64, mac-x64, linux-x64]

permissions:
  contents: write

concurrency:
  group: next-build-and-release
  cancel-in-progress: false

jobs:
  select-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      version: ${{ steps.select.outputs.version }}
      preview: ${{ steps.select.outputs.preview }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          REQUESTED_PLATFORM: ${{ inputs.platform }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const release = JSON.parse(fs.readFileSync('release-config.json', 'utf8'));
          const platforms = [
            {name:'mac-arm64',os:'macos-14',target:'aarch64-apple-darwin',platform:'darwin-arm64',bundles:'app',update_os:'macos',arch:'aarch64'},
            {name:'mac-x64',os:'macos-14',target:'x86_64-apple-darwin',platform:'darwin-x64',bundles:'app',update_os:'macos',arch:'x86_64'},
            {name:'win-x64',os:'windows-latest',target:'x86_64-pc-windows-msvc',platform:'win32-x64',bundles:'nsis',update_os:'windows',arch:'x86_64'},
            {name:'linux-x64',os:'ubuntu-latest',target:'x86_64-unknown-linux-gnu',platform:'linux-x64',bundles:'deb,appimage',update_os:'linux',arch:'x86_64'},
          ];
          const request = process.env.REQUESTED_PLATFORM || 'all';
          const selected = process.env.GITHUB_REF_TYPE === 'tag' || request === 'all' ? platforms : platforms.filter(p=>p.name===request);
          if (!selected.length) throw new Error('Unknown platform');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({include:selected})}\nversion=${release.version}\npreview=${release.channel==='preview'}\n`);
          JS

  verify:
    uses: ./.github/workflows/test.yml

  build:
    needs: [select-matrix, verify]
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      RUST_TARGET: ${{ matrix.target }}
      PLATFORM_TAG: ${{ matrix.platform }}
      UPDATE_OS: ${{ matrix.update_os }}
      UPDATE_ARCH: ${{ matrix.arch }}
      PUBLISH_APP: ${{ vars.PUBLISH_APP }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          rustflags: ""
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-next-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-next-release-${{ matrix.target }}-
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: '3.12'
      - name: macOS DMG tooling
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild-venv"
          "$RUNNER_TEMP/dmgbuild-venv/bin/python" -m pip install --disable-pip-version-check --no-input dmgbuild==1.6.7
          echo "$RUNNER_TEMP/dmgbuild-venv/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run release:check
      - run: npm run build
      - name: CLI binary
        run: cargo build -p wb-switch-server --release --locked --target ${{ matrix.target }}
      - name: Remove this target's stale bundles
        if: vars.PUBLISH_APP != 'false'
        run: node scripts/release-artifacts.mjs clean
      - name: Signed desktop application
        if: vars.PUBLISH_APP != 'false'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AGENT_COMPANION_TARGET: ${{ matrix.target }}
        run: node scripts/build-release.mjs --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: macOS drag-to-Applications image
        if: runner.os == 'macOS' && vars.PUBLISH_APP != 'false'
        env:
          RELEASE_VERSION: ${{ needs.select-matrix.outputs.version }}
        run: sh scripts/make-dmg.sh "$RELEASE_VERSION" "$UPDATE_ARCH" "target/$RUST_TARGET/release/bundle/macos/WorkBuddy Switch Next.app"
      - name: Collect signed archives and immutable updater manifests
        run: node scripts/release-artifacts.mjs collect
      - uses: actions/upload-artifact@v4
        with:
          name: next-${{ matrix.name }}
          path: dist-bin/
          if-no-files-found: error
      - name: Publish platform npm package (explicit opt-in)
        if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_NPM == 'true'
        working-directory: npm/platform/workbuddy-switch-next-${{ matrix.platform }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag ${{ needs.select-matrix.outputs.preview == 'true' && 'next' || 'latest' }}

  publish-npm:
    needs: [build, select-matrix]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag ${{ needs.select-matrix.outputs.preview == 'true' && 'next' || 'latest' }}

  release:
    needs: [build, select-matrix]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_APP != 'false'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.select-matrix.outputs.version }}
      IS_PREVIEW: ${{ needs.select-matrix.outputs.preview }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: next-*
          path: artifacts
          merge-multiple: true
      - name: Validate complete updater feed
        env:
          REQUIRED_PLATFORMS: darwin-aarch64,darwin-x86_64,windows-x86_64-nsis,windows-x86_64,linux-x86_64,linux-x86_64-deb,linux-x86_64-appimage
        run: |
          python3 scripts/merge-update-manifests.py artifacts
          node scripts/release-artifacts.mjs validate artifacts
          node scripts/release-artifacts.mjs checksums artifacts
      - name: Publish versioned release
        run: |
          FLAGS=()
          if [ "$IS_PREVIEW" = true ]; then FLAGS+=(--prerelease --latest=false); else FLAGS+=(--latest); fi
          gh release create "v$RELEASE_VERSION" artifacts/* --verify-tag \
            --title "WorkBuddy Switch Next $RELEASE_VERSION" \
            --notes-file "docs/releases/$RELEASE_VERSION.md" "${FLAGS[@]}"
      - name: Promote the preview update channel
        if: needs.select-matrix.outputs.preview == 'true'
        run: |
          if gh release view preview >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/preview" -f sha="$GITHUB_SHA" -F force=true
            gh release upload preview artifacts/* --clobber
            gh release edit preview --title "WorkBuddy Switch Next — 预览版" --notes-file "docs/releases/$RELEASE_VERSION.md" --prerelease --latest=false
          else
            gh release create preview artifacts/* --target "$GITHUB_SHA" --title "WorkBuddy Switch Next — 预览版" \
              --notes-file "docs/releases/$RELEASE_VERSION.md" --prerelease --latest=false
          fi
